name: Scheduled YouTube Publisher

on:
  schedule:
    # Runs automatically every 30 minutes to check if any video is due
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gspread google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Automated Publisher
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_HINDI: ${{ secrets.YOUTUBE_TOKEN_HINDI }}
          YOUTUBE_TOKEN_ENGLISH: ${{ secrets.YOUTUBE_TOKEN_ENGLISH }}
          TRACKING_SHEET_NAME: "Stickman Automation Tracker"
        run: |
          python automated_publisher.py
