name: Scheduled YouTube Publisher

on:
  schedule:
    # 12:00 AM IST (Midnight) = 18:30 UTC previous day -> Publishes English videos
    - cron: '30 18 * * *'
    # 04:30 PM IST (Evening rush) = 11:00 UTC -> Publishes Hindi videos
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to Publish (ENGLISH, HINDI, or ALL)'
        required: false
        default: 'ALL'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gspread google-api-python-client google-auth-oauthlib google-auth-httplib2 pytz

      - name: Run Automated Publisher
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_HINDI: ${{ secrets.YOUTUBE_TOKEN_HINDI }}
          YOUTUBE_TOKEN_ENGLISH: ${{ secrets.YOUTUBE_TOKEN_ENGLISH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TRACKING_SHEET_NAME: "YouTube Content Pipeline & Dispatcher"
          DISPATCH_CHANNEL: ${{ github.event.inputs.target_channel }}
        run: |
          python github/automated_publisher.py
