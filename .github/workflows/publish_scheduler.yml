name: Scheduled YouTube Publisher

on:
  schedule:
    # --- ENGLISH CHANNEL WINDOW (Target: 12:00 AM Midnight IST) ---
    # 18:30 UTC = 12:00 AM IST (Primary)
    - cron: '30 18 * * *'
    # 19:00 UTC = 12:30 AM IST (Fallback retry)
    - cron: '0 19 * * *'
    # 19:30 UTC = 01:00 AM IST (Safety net)
    - cron: '30 19 * * *'

    # --- HINDI CHANNEL WINDOW (Target: 04:30 PM IST) ---
    # 10:45 UTC = 04:15 PM IST (Early check - avoids :00 congestion)
    - cron: '45 10 * * *'
    # 11:15 UTC = 04:45 PM IST (Primary off-the-hour trigger)
    - cron: '15 11 * * *'
    # 11:45 UTC = 05:15 PM IST (Fallback retry)
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to Publish (ENGLISH, HINDI, or ALL)'
        required: false
        default: 'ALL'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gspread google-api-python-client google-auth-oauthlib google-auth-httplib2 pytz pyrogram tgcrypto

      - name: Pre-Flight Connection & Secrets Audit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_HINDI: ${{ secrets.YOUTUBE_TOKEN_HINDI }}
          YOUTUBE_TOKEN_ENGLISH: ${{ secrets.YOUTUBE_TOKEN_ENGLISH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          DAILY_FUN_FACTS: ${{ secrets.DAILY_FUN_FACTS || secrets.DAILY_FUN_FACTS_BOT_TOKEN || secrets.BOT_TOKEN_DAILY_FUN_FACTS || secrets.FACT_ENGINE_BOT_TOKEN }}
          HOW_DID_THAT_HAPPEN: ${{ secrets.HOW_DID_THAT_HAPPEN || secrets.HOW_DID_THAT_HAPPEN_BOT_TOKEN || secrets.BOT_TOKEN_HOW_DID_THAT_HAPPEN || secrets.BOT_TOKEN_ENGLISH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.MY_TELEGRAM_CHAT_ID || '5267470220' }}
          CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.MY_TELEGRAM_CHAT_ID || '5267470220' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '30360141' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'ecb0dc6dbe73524409a14f7dfff7b6e2' }}
        run: |
          python github/check_secrets_connection.py

      - name: Run Automated Publisher
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_HINDI: ${{ secrets.YOUTUBE_TOKEN_HINDI }}
          YOUTUBE_TOKEN_ENGLISH: ${{ secrets.YOUTUBE_TOKEN_ENGLISH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          DAILY_FUN_FACTS: ${{ secrets.DAILY_FUN_FACTS || secrets.DAILY_FUN_FACTS_BOT_TOKEN || secrets.BOT_TOKEN_DAILY_FUN_FACTS || secrets.FACT_ENGINE_BOT_TOKEN }}
          HOW_DID_THAT_HAPPEN: ${{ secrets.HOW_DID_THAT_HAPPEN || secrets.HOW_DID_THAT_HAPPEN_BOT_TOKEN || secrets.BOT_TOKEN_HOW_DID_THAT_HAPPEN || secrets.BOT_TOKEN_ENGLISH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.MY_TELEGRAM_CHAT_ID || '5267470220' }}
          CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.MY_TELEGRAM_CHAT_ID || '5267470220' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '30360141' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'ecb0dc6dbe73524409a14f7dfff7b6e2' }}
          TRACKING_SHEET_NAME: "YouTube Content Pipeline & Dispatcher"
          DISPATCH_CHANNEL: ${{ github.event.inputs.target_channel }}
        run: |
          python github/automated_publisher.py
